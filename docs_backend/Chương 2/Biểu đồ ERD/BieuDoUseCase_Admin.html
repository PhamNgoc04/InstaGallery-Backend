<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Biểu đồ use case chính - Quản trị viên</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      background: #fff;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .page {
      width: 800px;
      position: relative;
    }

    h1 {
      text-align: center;
      font-size: 16pt;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .diagram {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 400px;
    }

    #linesSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .actor-container {
      width: 150px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .actor-svg {
      margin-bottom: 8px;
    }

    .actor-name {
      font-size: 12pt;
      font-weight: bold;
      text-align: center;
      line-height: 1.2;
      background: #fff;
      padding: 2px;
    }

    .uc-container {
      flex: 1;
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      padding-left: 20px;
    }

    .uc-col {
      display: flex;
      flex-direction: column;
      gap: 30px;
      flex: 1;
      align-items: center;
    }

    .uc-col.left-col {
      padding-right: 15px;
    }

    .uc-col.right-col {
      padding-left: 15px;
      margin-top: 35px;
    }

    .uc {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 260px;
      height: 45px;
      border: 1.5px solid #000;
      border-radius: 50% / 100%;
      background-color: #ffffff;
      font-size: 11pt;
      text-align: center;
      padding: 0 10px;
      position: relative;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="page">
    <h1>Biểu đồ use case chính – Quản trị viên (Admin)</h1>

    <div class="diagram" id="diagram">
      <svg id="linesSvg" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="actor-container" id="actor">
        <svg class="actor-svg" width="60" height="120" viewBox="0 0 40 80">
          <circle cx="20" cy="12" r="10" fill="none" stroke="#000" stroke-width="2" />
          <line x1="20" y1="22" x2="20" y2="50" stroke="#000" stroke-width="2" />
          <line x1="5" y1="35" x2="35" y2="35" stroke="#000" stroke-width="2" />
          <line x1="20" y1="50" x2="8" y2="75" stroke="#000" stroke-width="2" />
          <line x1="20" y1="50" x2="32" y2="75" stroke="#000" stroke-width="2" />
        </svg>
        <div class="actor-name">Quản trị viên<br>(Admin)</div>
      </div>

      <div class="uc-container">
        <div class="uc-col left-col">
          <div class="uc">Đăng nhập</div>
          <div class="uc">Đổi mật khẩu</div>
          <div class="uc">Cập nhật thông tin cá nhân</div>
          <div class="uc">Quản lý người dùng</div>
          <div class="uc">Thống kê hệ thống</div>
        </div>
        <div class="uc-col right-col">
          <div class="uc">Đăng xuất</div>
          <div class="uc">Xóa bài đăng</div>
          <div class="uc">Kiểm duyệt nội dung</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      const diagram = document.getElementById('diagram');
      const svg = document.getElementById('linesSvg');
      const rect = diagram.getBoundingClientRect();

      svg.setAttribute('width', diagram.offsetWidth);
      svg.setAttribute('height', diagram.offsetHeight);
      svg.setAttribute('viewBox', `0 0 ${diagram.offsetWidth} ${diagram.offsetHeight}`);

      function getBounds(el) {
        const r = el.getBoundingClientRect();
        return {
          left: r.left - rect.left,
          right: r.right - rect.left,
          top: r.top - rect.top,
          bottom: r.bottom - rect.top,
          yCenter: r.top - rect.top + r.height / 2
        };
      }

      const actorEl = document.querySelector('#actor .actor-svg line:nth-child(2)');
      const actorPos = getBounds(actorEl);
      const startX = actorPos.left + (actorPos.right - actorPos.left) / 2 + 10;
      const startY = actorPos.yCenter;

      document.querySelectorAll('.uc').forEach(uc => {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        const ucPos = getBounds(uc);

        line.setAttribute('x1', startX);
        line.setAttribute('y1', startY);
        line.setAttribute('x2', ucPos.left);
        line.setAttribute('y2', ucPos.yCenter);
        line.setAttribute('stroke', '#000');
        line.setAttribute('stroke-width', '1');
        svg.appendChild(line);
      });
    });
  </script>
</body>

</html>
