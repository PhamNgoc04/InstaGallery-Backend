ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
    }
    application {
        modules = [ com.instagallery.ApplicationKt.module ]
    }
    environment = ${?KTOR_ENV}
}

jwt {
    secret = ${?JWT_SECRET}
    issuer = "http://localhost:8080/"
    audience = "http://localhost:8080/api/v1"
    realm = "InstaGallery"
    accessTokenMinutes = 15
    accessTokenMinutes = ${?JWT_ACCESS_TOKEN_MINUTES}
}

database {
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}

cors {
    allowedHosts = ["localhost:3000", "localhost:5173", "localhost:8080", "127.0.0.1:3000", "127.0.0.1:5173", "127.0.0.1:8080"]
}

google {
    webClientId = "647969867224-uejjvk9at6lglv6rcfvdocukkk0bqpq9.apps.googleusercontent.com"
    webClientId = ${?GOOGLE_WEB_CLIENT_ID}
}

auth {
    exposeDebugResetToken = false
    exposeDebugResetToken = ${?EXPOSE_DEBUG_RESET_TOKEN}
}

firebase {
    serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT_PATH}
}
